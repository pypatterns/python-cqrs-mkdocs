name: ci
on:
  push:
    branches:
      - master
      - main
      - docs/4.x
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install -r requirements.txt
      # Keep canonical site_url from mkdocs.yml (https://mkdocs.python-cqrs.dev/).
      # Do not rewrite to the old vadikko2.github.io path — production is Timeweb,
      # and Material version switching needs a correct site_url.
      - name: Build and verify assets
        run: |
          mkdocs build --strict
          ls -la site/
          test -f site/stylesheets/extra.css || (echo "ERROR: extra.css not in build" && exit 1)
          test -f site/javascripts/star-link.js || (echo "ERROR: star-link.js not in build" && exit 1)
      - name: Deploy versioned docs with mike
        run: |
          git fetch origin gh-pages || true
          if [ "${{ github.ref_name }}" = "docs/4.x" ]; then
            mike deploy --push 4.0
          else
            mike deploy --push --update-aliases 5.0 latest
            mike set-default --push latest
          fi
