theme:
  name: material
  custom_dir: overrides
  features:
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - navigation.footer
  icon:
    annotation: material/plus-circle
  font:
    text: IBM Plex Sans
  palette:
    - scheme: default
      primary: blue
      accent: blue
markdown_extensions:
  - meta
  - admonition
  - toc:
      permalink: true
  - codehilite:
      guess_lang: false
  - admonition
  - pymdownx.blocks.caption # Images
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vadikko2/python-cqrs
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/python-cqrs/
plugins:
  - search
  - awesome-pages
  - autorefs
  - mike:
      canonical_version: latest
      version_selector: true
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: |
        python-cqrs is a Python framework for CQRS, Saga, Mediator, and event-driven
        architectures. Use these docs for bootstrap, request/event handlers, transaction
        outbox, transactional inbox, streaming, FastAPI/FastStream integrations, and distributed sagas.
        The full text of every current page is in https://mkdocs.python-cqrs.dev/llms-full.txt
      sections:
        Agents:
          - agents.md
          - skills.md
        Getting started:
          - index.md
          - installation.md
          - migration/4-to-5.md
        Bootstrap:
          - bootstrap/*.md
        Dependency injection:
          - di.md
          - scoped_dependencies/*.md
        Commands and queries:
          - request_handler/*.md
          - request_response_types/*.md
        Streaming and chains:
          - stream_handling/*.md
          - chain_of_responsibility/*.md
        Saga:
          - saga/index.md
          - saga/flow.md
          - saga/storage.md
          - saga/recovery.md
          - saga/compensation.md
          - saga/examples.md
          - saga/fallback/*.md
        Events and outbox:
          - event_handler/*.md
          - outbox/*.md
          - inbox/*.md
          - orm.md
          - mermaid/*.md
        Integrations:
          - fastapi.md
          - faststream.md
          - event_producing.md
          - protobuf.md
        Testing:
          - testing/*.md
use_directory_urls: true
strict: true
docs_dir: docs
exclude_docs: |
  /plans/
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/navigation.js
  - javascripts/star-link.js
