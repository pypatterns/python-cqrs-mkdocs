{% extends "base.html" %}

{% block extrahead %}
  {% if page and page.meta and page.meta.robots %}
    <meta name="robots" content="{{ page.meta.robots }}" />
  {% else %}
    <meta name="robots" content="index, follow" />
  {% endif %}
  <link rel="alternate" type="text/plain" title="LLM index" href="{{ config.site_url }}llms.txt" />
{% endblock %}
