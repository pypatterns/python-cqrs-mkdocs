{% extends "base.html" %}

{% block extrahead %}
  {% if page and page.meta and page.meta.robots %}
    <meta name="robots" content="{{ page.meta.robots }}" />
  {% else %}
    <meta name="robots" content="index, follow" />
  {% endif %}
  {% set site_root = config.site_url if config.site_url.endswith('/') else config.site_url ~ '/' %}
  <link rel="alternate" type="text/plain" title="LLM index" href="{{ site_root }}llms.txt" />
  <link rel="alternate" type="text/plain" title="Full documentation" href="{{ site_root }}llms-full.txt" />
{% endblock %}
