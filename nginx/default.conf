server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Caddy/TLS terminators, keep Location headers relative so
    # directory slash redirects stay on https:// (not http://).
    absolute_redirect off;

    # mike set-default writes a JS redirect stub; prefer a real HTTP redirect
    # so bare / never renders docs HTML with wrong relative asset bases.
    location = / {
        return 302 /latest/;
    }

    location = /index.html {
        return 302 /latest/;
    }

    location / {
        try_files $uri $uri/ $uri/index.html @latest;
    }

    # extra.css is unhashed — force revalidation so header/version-selector
    # color fixes are not stuck behind a stale browser cache.
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri @latest;
    }

    location ~* \.(?:html)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri @latest;
    }

    # Pages live under a mike version directory. Links without one
    # (/testing/query/) go to the same path under /latest/. A path that
    # already names a version stays 404, so the redirect cannot loop.
    location @latest {
        if ($uri ~ ^/(?:latest|[0-9]+\.[0-9]+)/) {
            return 404;
        }
        return 301 /latest$request_uri;
    }
}
